<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KT FRESH</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="KT FRESH ">
    <meta property="og:description" content="ผลิตภัณฑ์อาหารจากมะม่วงมหาชนก">
    <meta property="og:image" content="images/feature.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #ffffff;
            overflow-x: hidden;
        }
        /* สไตล์สำหรับ Lite Embed */
        .youtube-lite {
            background-color: #000;
            position: relative;
            display: block;
            contain: content;
            cursor: pointer;
            background-position: center;
            background-size: cover;
        }
        /* ปุ่ม Play จำลอง */
        .youtube-lite::before {
            content: '';
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 48px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 48"><path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.64 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="red"/><path d="M45 24L27 14v20" fill="white"/></svg>');
            filter: grayscale(10%);
            transition: filter 0.1s cubic-bezier(0, 0, 0.2, 1);
            z-index: 1;
        }
        .youtube-lite:hover::before {
            filter: none;
        }
        /* ซ่อนวิดีโอที่ยังไม่ถึงคิวแสดง */
        .video-item.hidden-video {
            display: none;
        }
    </style>
</head>

<body class="text-gray-800 antialiased pb-32 lg:pb-0">

    <main class="w-full max-w-2xl mx-auto p-4 lg:p-8 flex flex-col gap-8">

        <h1 class="hidden text-3xl md:text-4xl font-semibold text-gray-900 mt-4 text-center lg:text-left">
            หัวข้อหลักของเว็บไซต์
        </h1>

        <p class="text-base md:text-lg text-[#1F1F1F] leading-relaxed text-center lg:text-left">
            ท้าพิสูจน์ความอร่อย! 🤔 ซอสมะม่วงมหาชนก KT FRESH ทั้ง 4 รสชาติ 🥭 ไปมิกซ์แอนด์แมตช์กับเมนูโปรด ทั้งฟาสต์ฟู้ด 🍔🍟 บาร์บีคิว 🍖🔥 และสลัด 🥗 การันตีความอร่อยฟินเข้ากันสุดๆ จนต้องมีติดบ้าน! 💛🛒
        </p>

        <!-- ส่วนของวิดีโอ -->
        <div id="video-container" class="flex flex-col gap-8">
            
            <!-- วิดีโอที่ 1 -->
            <div class="video-item w-full max-w-sm mx-auto aspect-[9/16] rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50">
                <div class="youtube-lite w-full h-full" data-id="aJmZb-puFOc" style="background-image: url('https://img.youtube.com/vi/aJmZb-puFOc/maxresdefault.jpg');"></div>
            </div>

            <!-- วิดีโอที่ 2 -->
            <div class="video-item w-full max-w-sm mx-auto aspect-[9/16] rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50">
                <div class="youtube-lite w-full h-full" data-id="S8WhwnR36tc" style="background-image: url('https://img.youtube.com/vi/S8WhwnR36tc/maxresdefault.jpg');"></div>
            </div>

            <!-- วิดีโอที่ 3 -->
            <div class="video-item w-full max-w-sm mx-auto aspect-[9/16] rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50">
                <div class="youtube-lite w-full h-full" data-id="5qHKsgNLEsA" style="background-image: url('https://img.youtube.com/vi/5qHKsgNLEsA/maxresdefault.jpg');"></div>
            </div>

            <!-- วิดีโอที่เหลือ (ซ่อนไว้ก่อน) -->
            <div class="video-item hidden-video w-full max-w-sm mx-auto aspect-[9/16] rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50">
                <div class="youtube-lite w-full h-full" data-id="v-Qh4Qd4Kk0" style="background-image: url('https://img.youtube.com/vi/v-Qh4Qd4Kk0/maxresdefault.jpg');"></div>
            </div>

            <div class="video-item hidden-video w-full max-w-sm mx-auto aspect-[9/16] rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50">
                <div class="youtube-lite w-full h-full" data-id="cHUEawfcpWU" style="background-image: url('https://img.youtube.com/vi/cHUEawfcpWU/maxresdefault.jpg');"></div>
            </div>

            <div class="video-item hidden-video w-full max-w-sm mx-auto aspect-[9/16] rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50">
                <div class="youtube-lite w-full h-full" data-id="Yv8HDq8V8oc" style="background-image: url('https://img.youtube.com/vi/Yv8HDq8V8oc/maxresdefault.jpg');"></div>
            </div>

            <div class="video-item hidden-video w-full max-w-sm mx-auto aspect-[9/16] rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50">
                <div class="youtube-lite w-full h-full" data-id="RzU92E5oDj0" style="background-image: url('https://img.youtube.com/vi/RzU92E5oDj0/maxresdefault.jpg');"></div>
            </div>

            <div class="video-item hidden-video w-full max-w-sm mx-auto aspect-[9/16] rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50">
                <div class="youtube-lite w-full h-full" data-id="h79pkCWgoc8" style="background-image: url('https://img.youtube.com/vi/h79pkCWgoc8/maxresdefault.jpg');"></div>
            </div>
        </div>

        <!-- ปุ่ม Load More -->
        <div id="load-more-container" class="flex justify-center mt-4">
            <button id="load-more-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 px-8 rounded-xl transition-colors border border-gray-200">
                ดูวิดีโอเพิ่มเติม
            </button>
        </div>

        <p class="text-base md:text-lg text-[#1F1F1F] leading-relaxed text-center lg:text-left">
            สนใจสอบถามหรือสั่งซื้อทางแชทหรือสั่งซื้อออนไลน์ได้เลยค่ะ🛒
        </p>

        <div class="fixed bottom-0 left-0 right-0 p-4 pb-6 z-50 flex justify-center bg-white/95 backdrop-blur-sm border-t border-gray-100 shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.05)] lg:static lg:p-0 lg:bg-transparent lg:border-0 lg:shadow-none lg:backdrop-blur-none lg:bottom-auto lg:z-auto">
            <a href="https://lin.ee/yqZfpvV" target="_blank" class="flex items-center justify-center w-full max-w-md mx-auto bg-[#00B900] hover:bg-[#00a000] text-white text-lg font-medium py-4 px-6 rounded-2xl shadow-lg lg:shadow-md transition-transform transform hover:scale-[1.02] active:scale-95">
                <img src="images/line-icon.png" alt="LINE Icon" class="w-7 h-7 mr-3 object-contain" onerror="this.style.display='none'">
                สอบถาม/สั่งซื้อ ทักแชทได้เลย!
            </a>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. ระบบ Lite Embed: เปลี่ยนรูปเป็นวิดีโอเมื่อคลิก
            const youtubeLites = document.querySelectorAll('.youtube-lite');
            youtubeLites.forEach(el => {
                el.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    const iframe = document.createElement('iframe');
                    iframe.setAttribute('width', '100%');
                    iframe.setAttribute('height', '100%');
                    iframe.setAttribute('src', `https://www.youtube.com/embed/${id}?autoplay=1`);
                    iframe.setAttribute('frameborder', '0');
                    iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                    iframe.setAttribute('allowfullscreen', '1');
                    
                    this.innerHTML = '';
                    this.appendChild(iframe);
                    this.classList.remove('youtube-lite'); // เอาปุ่ม Play ออก
                });
            });

            // 2. ระบบ Load More
            const loadMoreBtn = document.getElementById('load-more-btn');
            const hiddenVideos = document.querySelectorAll('.video-item.hidden-video');
            let currentVisibleIndex = 0;
            const batchSize = 2;

            loadMoreBtn.addEventListener('click', function() {
                let count = 0;
                for (let i = currentVisibleIndex; i < hiddenVideos.length && count < batchSize; i++) {
                    hiddenVideos[i].classList.remove('hidden-video');
                    currentVisibleIndex++;
                    count++;
                }
                if (currentVisibleIndex >= hiddenVideos.length) {
                    document.getElementById('load-more-container').style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
